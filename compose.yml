services:
    backend-kyotei:
      restart: unless-stopped
      build:
        context: ../kyotei-backend
        dockerfile: ../kyotei-deploy/api/Dockerfile
      volumes:
        - ../kyotei-backend:/api
        - /api/node_modules
      environment:
        PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: "false"
        DB_API_HOST: api-db
        DB_API_PORT: 5432
        DB_WEBAPP_HOST: webapp-db
        DB_WEBAPP_PORT: 5432
        SMTP_HOST: mailhog
        SMTP_PORT: 1025
      ports:
        - "${API_PORT}:3000"
      networks:
        - kyotei_api_network
        - kyotei_webapp_network

    webapp-kyotei:
      restart: unless-stopped
      build:
        context: ../kyotei-webapp
        dockerfile: ../kyotei-deploy/webapp/Dockerfile
      environment:
        PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: "false"
      volumes:
        - ../kyotei-webapp:/webapp
        - /webapp/node_modules
      ports:
        - "${WEBAPP_PORT}:8000"
      networks:
        - kyotei_webapp_network
        - kyotei_api_network

    webapp-db:
      image: postgres:17
      container_name: kyotei_webapp_db
      restart: unless-stopped
      environment:
        POSTGRES_USER: ${WEBAPP_DB_USER}
        POSTGRES_PASSWORD: ${WEBAPP_DB_PASSWORD}
        POSTGRES_DB: ${WEBAPP_DB_NAME}
      ports:
        - "${WEBAPP_DB_PORT}:5432"
      volumes:
        - webapp-db-vol:/var/lib/postgresql/data
      networks:
        - kyotei_webapp_network

    api-db:
      image: postgres:17
      container_name: kyotei_api_db
      restart: unless-stopped
      environment:
        POSTGRES_USER: ${API_DB_USER}
        POSTGRES_PASSWORD: ${API_DB_PASSWORD}
        POSTGRES_DB: ${API_DB_NAME}
      ports:
        - "${API_DB_PORT}:5432"
      volumes:
        - api-db-vol:/var/lib/postgresql/data
      networks:
        - kyotei_api_network

    mailhog:
        image: mailhog/mailhog:latest
        restart: unless-stopped
        ports:
          - 1025:1025
          - 8025:8025
        networks: 
          - kyotei_api_network

networks:
  kyotei_webapp_network: {}
  kyotei_api_network: {}

volumes:
  api-db-vol:
  webapp-db-vol:
  api-node-modules:
  webapp-node-modules:
